services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dcm-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-dcmtool}
      POSTGRES_USER: ${DB_USER:-dcmtool}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dcmtool}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dcm-network

  redis:
    image: redis:7-alpine
    container_name: dcm-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dcm-network

  backend:
    container_name: dcm-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:-dcmtool}
      DB_USER: ${DB_USER:-dcmtool}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.${DJANGO_ENV:-dev}
    networks:
      - dcm-network

volumes:
  postgres_data:

networks:
  dcm-network:
    driver: bridge
