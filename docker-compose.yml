services:
  dcm-frontend:
    build: .
    container_name: dcm-frontend
    restart: unless-stopped
    ports:
      - "3334:3334"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /var/run/utmp:/host/var/run/utmp:ro
    environment:
      - NODE_ENV=production
      - PORT=3334
      - ORIGIN=http://192.168.0.16:7003
      - BASE_PATH=/dcmtool
    pid: host
    privileged: true
