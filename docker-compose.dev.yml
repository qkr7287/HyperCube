services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      DJANGO_ENV: dev
      DEBUG: "true"
      WATCHFILES_FORCE_POLLING: "true"

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: dcm-nginx-dev
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dcm-network
