# Development stack.
#
# Two ways to run this:
#
# 1) Local Docker (everything on your PC)
#    $ docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#        --env-file .env.dev up
#
# 2) Remote Docker on a dev server via Mutagen file-sync
#    - Mutagen keeps your local checkout and the server in lockstep.
#    - You run `docker compose` directly on the server (via SSH).
#    - See docs/operations.md → "Dev on server 41" for the full recipe.

services:
  # Postgres + Redis publish on non-default host ports so multiple dev
  # stacks can coexist on a single box. Override in your local .env.dev
  # if you need something else.
  postgres:
    ports:
      - "${DB_PORT:-15432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-16379}:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${BE_PORT:-8000}:8000"
    environment:
      DJANGO_ENV: dev
      DEBUG: "true"
      WATCHFILES_FORCE_POLLING: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - hc-network

  # Auto-applies new migrations when `apps/**/migrations/*.py` change on disk.
  # Closes the dev-only gap where `uvicorn --reload` picks up code instantly
  # but compose `command` only runs `migrate` at container boot, leaving the
  # DB schema behind freshly-pulled code (see hc-redis 500 incident).
  migrate-watcher:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hc-migrate-watcher
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      DB_NAME: ${DB_NAME:-hypercube}
      DB_USER: ${DB_USER:-hypercube}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      DJANGO_ENV: dev
      DJANGO_SETTINGS_MODULE: config.settings.dev
      WATCHFILES_FORCE_POLLING: "true"
    command: python scripts/migrate_watcher.py
    networks:
      - hc-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    command: celery -A config worker -l info --concurrency=2
    environment:
      DJANGO_ENV: dev
      DEBUG: "true"
    networks:
      - hc-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
    command: celery -A config beat -l info
    environment:
      DJANGO_ENV: dev
      DEBUG: "true"
    networks:
      - hc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hc-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "${FE_PORT:-3000}:3000"
    environment:
      API_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hc-network

networks:
  hc-network:
    driver: bridge
