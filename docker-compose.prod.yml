# Local "prod-like" compose. Use this when you want to rebuild images
# from source on the current machine (no registry involved).
# For image-based appliance deploys, use deploy/docker-compose.yml
# (pulls pre-built images from GHCR — no source tree required).

services:
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hc-nginx
    restart: unless-stopped
    ports:
      - "${HC_PORT:-37003}:7003"
    depends_on:
      - backend
    networks:
      - hc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 4"
    restart: unless-stopped
    environment:
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "false"
    networks:
      - hc-network
      - hc-ml-internal

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency=2
    restart: unless-stopped
    environment:
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    restart: unless-stopped
    environment:
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod

networks:
  hc-ml-internal:
    external: true
    name: hc-ml-internal
