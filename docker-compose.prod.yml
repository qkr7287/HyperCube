services:
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hc-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "7003:7003"
    depends_on:
      - backend
    networks:
      - hc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      DJANGO_ENV: prod
      DEBUG: "false"
