# HyperCube main → DCMTool dev 자동 동기화
name: Sync to DCMTool

on:
  push:
    branches: [main]

jobs:
  sync:
    if: github.repository == 'qkr7287/HyperCube'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout HyperCube
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Push to DCMTool dev branch
        run: |
          git remote add dcmtool git@github.com:dev-agics/DCMTool.git
          git push dcmtool main:dev --force
