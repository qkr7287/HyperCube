# Build + push HyperCube container images to GHCR.
# Triggered when main moves forward; target users pull these images with
# `docker compose pull` from deploy/docker-compose.yml — no source tree
# on the deploy host.
#
# Images:
#   ghcr.io/<owner>/hypercube-backend:{latest,sha-xxxxxxx}
#   ghcr.io/<owner>/hypercube-nginx:{latest,sha-xxxxxxx}

name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.repository == 'qkr7287/HyperCube'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "value=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set short SHA
        id: sha
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/hypercube-backend:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/hypercube-backend:sha-${{ steps.sha.outputs.value }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/hypercube-nginx:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/hypercube-nginx:sha-${{ steps.sha.outputs.value }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

      - name: Summary
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/hypercube-backend:sha-${{ steps.sha.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/hypercube-nginx:sha-${{ steps.sha.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
